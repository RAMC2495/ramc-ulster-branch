backend:
  name: git-gateway
  branch: mainbackend:
  name: github
  repo: RAMC2495/ramc-ulster-branch
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:

  - name: "events"
    label: "Events"
    folder: "content/events"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"

    fields:

      - label: "Event Name"
        name: "title"
        widget: "string"

      - label: "Date"
        name: "date"
        widget: "datetime"
        date_format: "DD/MM/YYYY"
        time_format: "HH:mm"
        format: "YYYY-MM-DD HH:mm"

      - label: "Location"
        name: "location"
        widget: "string"

      - label: "Description"
        name: "description"
        widget: "text"

      - label: "Additional Information"
        name: "information"
        widget: "text"
        required: false
